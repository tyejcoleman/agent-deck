name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify version and tests
        run: |
          cli_version="$(./deck --version | awk '{print $2}')"
          test "v$cli_version" = "$GITHUB_REF_NAME"
          bash tests/smoke.sh
      - name: Build release checksums
        run: sha256sum deck install.sh > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" deck install.sh SHA256SUMS \
            --verify-tag \
            --title "Agent Deck $GITHUB_REF_NAME" \
            --generate-notes
